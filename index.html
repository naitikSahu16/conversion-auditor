<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- FORCE BROWSER TO LOAD FRESH CODE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Conversion Auditor AI Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 50px 40px; 
            border-radius: 16px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 850px; 
            width: 100%;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 36px; 
            font-weight: 700; 
            margin-bottom: 12px; 
            color: #0f172a;
            letter-spacing: -0.5px;
        }
        p.subtitle { 
            font-size: 18px; 
            color: #64748b; 
            margin-bottom: 40px; 
            line-height: 1.6;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input {
            width: 100%;
            padding: 24px 20px; 
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            color: #0f172a;
            font-size: 18px; 
            box-sizing: border-box;
            outline: none;
            transition: 0.3s ease;
        }
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        button {
            background-color: #2563eb; 
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 20px; 
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
        button:hover { 
            background-color: #1d4ed8; 
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(37, 99, 235, 0.3);
        }
        .loader {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-card {
            display: none;
            margin-top: 40px;
            text-align: left;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        .badge-danger {
            background-color: #fee2e2;
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #fca5a5;
        }
        .metric-text {
            font-size: 16px;
            color: #334155;
            line-height: 1.8;
            word-wrap: break-word;
        }
        strong {
            color: #0f172a;
            font-weight: 700;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 25px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Conversion Auditor AI</h1>
        <p class="subtitle">Enter any landing page URL. Get a brutal, hyper-specific conversion roast.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste website link here (e.g., https://tesla.com)">
            <!-- BUTTON TEXT CHANGED SO YOU KNOW IT UPDATED -->
            <button onclick="startAudit()">Run Strict Audit ⚡</button>
        </div>
        
        <div class="loader" id="spinner"></div>

        <div id="result-card"></div>
    </div>

    <script>
        async function startAudit() {
            const url = document.getElementById('urlInput').value;
            const spinner = document.getElementById('spinner');
            const resultCard = document.getElementById('result-card');
            
            if(!url) {
                alert("Please enter a valid website URL to begin the audit.");
                return;
            }

            resultCard.style.display = 'none';
            spinner.style.display = 'block';
            
            const score = Math.floor(Math.random() * (45 - 15 + 1)) + 15;
            let aiText = "";

            try {
                // THE STRICT PROMPT
                const promptText = `Act as an absolutely ruthless, strict Silicon Valley CRO expert. I am giving you a website link: ${url}. I do NOT want generic advice. I want 3 hyper-specific, brutal bullet points about what is wrong with the UX, copy, or trust signals of ${url}. Make it sound real and customized to their specific industry and brand. Format strictly with bullet points. No intro, no outro, just the direct roast.`;
                
                // THE KEYLESS API (Will never be blocked by GitHub, No Keys Required)
                const response = await fetch(`https://text.pollinations.ai/prompt/${encodeURIComponent(promptText)}`);

                if (!response.ok) {
                    throw new Error("Server overloaded.");
                }

                aiText = await response.text();

            } catch (error) {
                aiText = `🚨 <strong>Connection Error:</strong> The AI is currently generating too many audits. Please wait 10 seconds and try again.`;
            }

            // TEXT FORMATTER
            const formattedText = aiText
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            spinner.style.display = 'none';
            resultCard.style.display = 'block';
            
            resultCard.innerHTML = `
                <div class="badge-danger">Conversion Score: ${score}/100</div>
                <div class="metric-text">
                    <strong>Target:</strong> ${url}<br><br>
                    <strong>Strict AI Audit Result:</strong><br><br>
                    ${formattedText}
                    <hr>
                    <i style="color: #64748b;">Want deeper insights? Run a full 1,000-AI simulation on our main SaaS (Coming Soon).</i>
                </div>
            `;
        }
    </script>

</body>
</html>

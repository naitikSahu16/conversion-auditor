<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    
    <title>Conversion Auditor AI Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 50px 40px; 
            border-radius: 16px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 850px; 
            width: 100%;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 36px; 
            font-weight: 700; 
            margin-bottom: 12px; 
            color: #0f172a;
            letter-spacing: -0.5px;
        }
        p.subtitle { 
            font-size: 18px; 
            color: #64748b; 
            margin-bottom: 40px; 
            line-height: 1.6;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        input {
            width: 100%;
            padding: 24px 20px; 
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background-color: #f8fafc;
            color: #0f172a;
            font-size: 18px; 
            box-sizing: border-box;
            outline: none;
            transition: 0.3s ease;
        }
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        button {
            background-color: #2563eb; 
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 20px; 
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }
        button:hover { 
            background-color: #1d4ed8; 
            transform: translateY(-2px);
        }
        .loader {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 40px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-card {
            display: none;
            margin-top: 40px;
            text-align: left;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 35px;
            border-radius: 12px;
        }
        .badge-danger {
            background-color: #fee2e2;
            color: #ef4444;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #fca5a5;
        }
        .metric-text {
            font-size: 16px;
            color: #334155;
            line-height: 1.8;
            word-wrap: break-word;
        }
        strong {
            color: #0f172a;
            font-weight: 700;
        }
        hr {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 25px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Conversion Auditor AI</h1>
        <p class="subtitle">Enter any landing page URL for a deeply specific conversion roast.</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste website link here (e.g., https://tesla.com)">
            <!-- BROWSER CACHE CHECKER BUTTON -->
            <button onclick="startAudit()">Run Audit (Version 10) 🚀</button>
        </div>
        
        <div class="loader" id="spinner"></div>

        <div id="result-card"></div>
    </div>

    <script>
        async function startAudit() {
            const url = document.getElementById('urlInput').value;
            const spinner = document.getElementById('spinner');
            const resultCard = document.getElementById('result-card');
            
            if(!url) {
                alert("Please enter a valid website URL to begin the audit.");
                return;
            }

            resultCard.style.display = 'none';
            spinner.style.display = 'block';

            // AAPKI EXACT API KEY
            const GEMINI_API_KEY = "AQ.Ab8RN6JZZkeC5Ax2geK5-096qS7FOkWwt2k7b7vfFqi_o5fmJw"; 

            let aiText = "";
            let finalModelUsed = "";
            const score = Math.floor(Math.random() * (45 - 15 + 1)) + 15;

            try {
                // JAISE ERROR NE BOLA: Pehle Google se ListModels call karo
                const listResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_API_KEY}`);
                const listData = await listResponse.json();

                if(listData.error) {
                    throw new Error(`Google Auth Failed: Is API Key allowed to be used? Check error: ${listData.error.message}`);
                }

                // AI Models filter karo jo text likh sakte hain
                const validModels = listData.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"));

                if (validModels.length === 0) {
                    throw new Error("Aapki key connect ho gayi, par Google ne abhi tak is key par koi text AI model assign nahi kiya hai.");
                }

                // Pehla working model uthao
                const selectedModel = validModels.find(m => m.name.includes("flash")) || validModels[0];
                finalModelUsed = selectedModel.name;

                // Asli Audit Request (Naye Model Name Ke Sath)
                const promptText = `You are an elite CRO expert. Analyze this specific URL: ${url}. Provide exactly 3 brutal, hyper-specific bullet points highlighting conversion killers, UX flaws, or bad copy based ONLY on what this brand/industry does. Do NOT use generic advice. Be ruthless. Limit to 100 words total.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${finalModelUsed}:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message);
                }
                
                aiText = data.candidates[0].content.parts[0].text;

            } catch (error) {
                aiText = `🚨 <strong>System Diagnostic:</strong> ${error.message}`;
            }

            // TEXT FORMATTER
            const formattedText = aiText
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');

            spinner.style.display = 'none';
            resultCard.style.display = 'block';
            
            resultCard.innerHTML = `
                <div class="badge-danger">Conversion Score: ${score}/100</div>
                <div class="metric-text">
                    <strong>Target:</strong> ${url}<br><br>
                    <strong>Master Audit Result:</strong><br><br>
                    ${formattedText}
                    <hr>
                    <i style="color: #64748b; font-size: 13px;">Tested with: ${finalModelUsed.replace('models/', '') || 'Failed'}</i>
                </div>
            `;
        }
    </script>

</body>
</html>

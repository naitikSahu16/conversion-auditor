<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Conversion Auditor AI | Brutal CRO Roast</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --dark: #0f172a;
      --gray: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .app {
      max-width: 780px;
      width: 100%;
      background: var(--card);
      border-radius: 2rem;
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      transition: all 0.2s ease;
    }
    @media (max-width: 500px) {
      .app {
        padding: 2rem 1.25rem;
        border-radius: 1.5rem;
      }
    }
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .header-icon {
      background: var(--dark);
      color: white;
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 10px 20px -5px rgba(15,23,42,0.3);
    }
    .header-text {
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.5px;
      color: var(--dark);
    }
    .header-text span {
      background: linear-gradient(135deg, var(--primary), #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--gray);
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
      border-left: 4px solid var(--primary);
      padding-left: 1rem;
      font-weight: 500;
      background: linear-gradient(to right, #f1f5f9, transparent);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .url-wrapper {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 1rem;
      padding: 0.2rem 0.2rem 0.2rem 1.25rem;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .url-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
      background: white;
    }
    .url-wrapper i {
      color: var(--gray);
      font-size: 1.1rem;
    }
    .url-wrapper input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 0.9rem 0.75rem;
      font-size: 1rem;
      outline: none;
      color: var(--dark);
      font-weight: 500;
    }
    .btn {
      background: var(--dark);
      color: white;
      border: none;
      border-radius: 1rem;
      padding: 0.95rem 1.8rem;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(15,23,42,0.1);
    }
    .btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px -8px rgba(15,23,42,0.25);
    }
    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 1.5rem 0;
      color: var(--primary);
      font-weight: 500;
    }
    .spinner {
      width: 1.5rem;
      height: 1.5rem;
      border: 3px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .result-card {
      background: white;
      border: 1px solid #e9eef3;
      border-radius: 1.5rem;
      padding: 1.8rem;
      margin-top: 1.5rem;
      box-shadow: 0 15px 30px -12px rgba(0,0,0,0.05);
      animation: fadeSlide 0.3s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .score-label {
      color: var(--gray);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge {
      font-weight: 700;
      font-size: 1.8rem;
      padding: 0.4rem 1.2rem;
      border-radius: 2.5rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .badge.low {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .badge.mid {
      background: #fffbeb;
      color: #d97706;
      border: 1px solid #fde68a;
    }
    .roast-title {
      font-weight: 700;
      color: var(--dark);
      font-size: 1.2rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .roast-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .roast-item {
      background: #f8fafc;
      border-radius: 1rem;
      padding: 1rem 1.2rem;
      border-left: 5px solid var(--primary);
      font-size: 0.98rem;
      color: #1e293b;
      line-height: 1.5;
      font-weight: 500;
    }
    .roast-item i {
      color: var(--primary);
      margin-right: 0.5rem;
    }
    .error-box {
      background: #fff1f2;
      color: #be123c;
      padding: 1rem 1.2rem;
      border-radius: 1rem;
      border: 1px solid #fecdd3;
      margin-top: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .hidden {
      display: none !important;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .history-section {
      margin-top: 2rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
    .history-title {
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .history-item {
      background: #f8fafc;
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      color: var(--dark);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e9eef3;
    }
    .history-url {
      font-weight: 600;
      color: var(--primary);
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      padding: 0.3rem 0.7rem;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--gray);
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: #f1f5f9;
      border-color: var(--primary);
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-icon"><i class="fas fa-magnifying-glass-chart"></i></div>
      <div class="header-text">Auditor<span>AI</span></div>
    </div>
    <div class="subtitle">🔥 Drop your URL. Get a brutal, 3‑point CRO roast that actually fixes leaks.</div>

    <div class="input-group">
      <div class="url-wrapper">
        <i class="fas fa-link"></i>
        <input type="url" id="urlInput" placeholder="https://example.com/landing-page" autocomplete="off">
      </div>
      <button id="auditBtn" class="btn">
        <i class="fas fa-bolt"></i> Run Audit
      </button>
    </div>

    <div id="loading" class="loader hidden">
      <div class="spinner"></div> <span>Dissecting your page…</span>
    </div>
    <div id="resultContainer" class="hidden"></div>

    <!-- Audit history -->
    <div id="historySection" class="history-section hidden">
      <div class="history-title"><i class="fas fa-history"></i> Recent Audits</div>
      <div id="historyList" class="history-list"></div>
    </div>

    <div class="footer">
      <i class="far fa-shield-alt"></i> Powered by OpenRouter + Gemini
      <span style="margin-left:0.5rem;background:#f1f5f9;padding:0.2rem 0.6rem;border-radius:1rem;font-size:0.75rem" id="auditCount">0 audits</span>
    </div>
  </div>

  <script>
    (function() {
      // ═══════════════ YOUR OPENROUTER API KEY ═══════════════
      const OPENROUTER_KEY = "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";
      const API_URL = "https://openrouter.ai/api/v1/chat/completions";
      const SITE_URL = window.location.origin || "https://conversion-auditor.vercel.app";

      // DOM nodes
      const urlInput = document.getElementById('urlInput');
      const auditBtn = document.getElementById('auditBtn');
      const loader = document.getElementById('loading');
      const resultContainer = document.getElementById('resultContainer');
      const historySection = document.getElementById('historySection');
      const historyList = document.getElementById('historyList');
      const auditCountSpan = document.getElementById('auditCount');

      // Local state
      let auditCount = parseInt(localStorage.getItem('cro_audit_count') || '0');
      let auditHistory = JSON.parse(localStorage.getItem('cro_audit_history') || '[]'); // {url, score, points, date}

      // Update UI counters
      auditCountSpan.textContent = `${auditCount} audits`;
      if (auditHistory.length > 0) {
        historySection.classList.remove('hidden');
        renderHistory();
      }

      // ────────── helpers ──────────
      const randomScore = () => Math.floor(Math.random() * 31) + 15;
      const escapeHtml = (str) => str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      // Parse AI text into array of 3 points
      function parseRoast(text) {
        let clean = text.trim().replace(/\*\*/g, '');
        let lines = clean.split('\n').filter(l => l.trim().length > 0)
          .map(l => l.replace(/^[\s•\-*]*\d+[\.\)]\s*/, '').trim())
          .filter(l => l.length > 15);
        if (lines.length >= 3) return lines.slice(0, 3);
        let sents = clean.split(/(?<=[.!?])\s+(?=[A-Z])/).filter(s => s.length > 15).slice(0, 3);
        return sents.length >= 3 ? sents : [clean];
      }

      // Save to history
      function saveToHistory(url, score, points) {
        const entry = { url, score, points, date: new Date().toLocaleString() };
        auditHistory.unshift(entry);
        if (auditHistory.length > 3) auditHistory = auditHistory.slice(0, 3);
        localStorage.setItem('cro_audit_history', JSON.stringify(auditHistory));
        auditCount++;
        localStorage.setItem('cro_audit_count', auditCount);
        auditCountSpan.textContent = `${auditCount} audits`;
        historySection.classList.remove('hidden');
        renderHistory();
      }

      function renderHistory() {
        historyList.innerHTML = auditHistory.map((item, idx) => `
          <div class="history-item">
            <span class="history-url" title="${escapeHtml(item.url)}">${escapeHtml(item.url)}</span>
            <span style="display:flex;align-items:center;gap:0.5rem;">
              <span style="font-weight:700;color:${item.score<=25?'#b91c1c':'#d97706'}">${item.score}/100</span>
              <button class="copy-btn" data-index="${idx}" title="Copy roast"><i class="far fa-copy"></i></button>
            </span>
          </div>
        `).join('');
        // Attach copy listeners
        document.querySelectorAll('.copy-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const index = e.currentTarget.dataset.index;
            const entry = auditHistory[index];
            if (entry) {
              const text = entry.points.map((p,i) => `${i+1}. ${p}`).join('\n');
              navigator.clipboard.writeText(text).then(() => {
                const icon = e.currentTarget.querySelector('i');
                icon.className = 'fas fa-check';
                setTimeout(() => { icon.className = 'far fa-copy'; }, 1500);
              });
            }
          });
        });
      }

      function renderResult(url, score, roastPoints) {
        const emoji = score <= 20 ? '😱' : score <= 30 ? '😬' : '😅';
        const cls = score <= 25 ? 'low' : 'mid';
        const html = `
          <div class="result-card">
            <div class="score-row">
              <span class="score-label">📊 Conversion Score</span>
              <span class="badge ${cls}">${emoji} ${score}/100</span>
            </div>
            <div class="roast-title"><i class="fas fa-fire" style="color:#ef4444"></i> Brutal CRO Roast</div>
            <ul class="roast-list">
              ${roastPoints.map((p, i) => `<li class="roast-item"><i class="fas fa-${i+1}"></i>${escapeHtml(p)}</li>`).join('')}
            </ul>
          </div>
        `;
        resultContainer.innerHTML = html;
        resultContainer.classList.remove('hidden');
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function showError(message) {
        resultContainer.innerHTML = `<div class="error-box"><i class="fas fa-circle-exclamation"></i> ${escapeHtml(message)}</div>`;
        resultContainer.classList.remove('hidden');
      }

      // ────────── API call with fallback models ──────────
      async function callOpenRouter(prompt) {
        const models = [
          'google/gemini-2.0-flash-001',
          'google/gemini-flash-1.5',
          'google/gemini-pro',
          'google/palm-2-chat-bison'
        ];
        let lastError = null;
        for (const model of models) {
          try {
            const response = await fetch(API_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENROUTER_KEY}`,
                'HTTP-Referer': SITE_URL,
                'X-Title': 'Conversion Auditor AI'
              },
              body: JSON.stringify({
                model,
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.9,
                max_tokens: 500
              })
            });
            if (response.ok) {
              const data = await response.json();
              const content = data?.choices?.[0]?.message?.content;
              if (content && content.trim().length > 20) return content;
              else throw new Error('Short response');
            } else {
              const errText = await response.text();
              console.warn(`Model ${model} failed (${response.status})`);
              lastError = `${response.status}: ${errText.slice(0,100)}`;
            }
          } catch (err) {
            console.warn(`Model ${model} error:`, err.message);
            lastError = err.message;
          }
        }
        throw new Error(lastError || 'All models failed. Check your OpenRouter credits or key.');
      }

      // ────────── main audit flow ──────────
      async function runAudit() {
        let rawUrl = urlInput.value.trim();
        if (!rawUrl) return showError('Please enter a website URL.');
        if (!rawUrl.startsWith('http')) rawUrl = 'https://' + rawUrl;
        try { new URL(rawUrl); } catch (_) { return showError('Invalid URL format.'); }

        // UI feedback
        auditBtn.disabled = true;
        loader.classList.remove('hidden');
        resultContainer.classList.add('hidden');
        resultContainer.innerHTML = '';

        // Randomize CRO aspects to get unique output each time
        const allAspects = [
          'headline clarity', 'CTA copy/color/placement', 'social proof', 'mobile responsiveness',
          'perceived load speed', 'trust signals (badges, guarantees)', 'form friction',
          'value proposition above the fold', 'visual hierarchy', 'urgency/scarcity',
          'navigation clarity', 'readability & formatting'
        ];
        const selected = allAspects.sort(() => Math.random() - 0.5).slice(0, 3);
        const prompt = `You are a world-class CRO expert. Analyze the website: ${rawUrl}.
Focus specifically on these aspects: ${selected.join(', ')}.
Give a brutal, no-fluff 3‑point roast. Each point must be 1-2 sentences, extremely specific and actionable.
Format:
1. [first leak + fix]
2. [second leak + fix]
3. [third leak + fix]`;

        try {
          const aiText = await callOpenRouter(prompt);
          const points = parseRoast(aiText);
          const score = randomScore();
          renderResult(rawUrl, score, points);
          saveToHistory(rawUrl, score, points);
        } catch (err) {
          showError(err.message || 'Unexpected error. Please try again.');
        } finally {
          auditBtn.disabled = false;
          loader.classList.add('hidden');
        }
      }

      // Event binding
      auditBtn.addEventListener('click', runAudit);
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') runAudit();
      });

      // Optional initial placeholder
      urlInput.placeholder = 'https://stripe.com/pricing';
    })();
  </script>
</body>
</html>
